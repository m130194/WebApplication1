services:
  keyfile-init:
    image: mongo:8.0
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        printf '%s' "$$MONGO_REPLICA_KEY" > /keyfile/mongodb-keyfile
        chown mongodb:mongodb /keyfile/mongodb-keyfile
        chmod 400 /keyfile/mongodb-keyfile
        echo "MongoDB replica-set keyfile created."
    environment:
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY}
    volumes:
      - mongo-keyfile:/keyfile

  mongodb:
    image: mongo:8.0
    container_name: blog-mongodb
    depends_on:
      keyfile-init:
        condition: service_completed_successfully
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /keyfile/mongodb-keyfile
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - blog-mongo-data:/data/db
      - mongo-keyfile:/keyfile:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host localhost --port 27017 -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./WebApplication1
      dockerfile: Dockerfile
    container_name: blog-api
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin&replicaSet=rs0&directConnection=true"
      MongoDb__DatabaseName: BlogDb
      MongoDb__CollectionName: BlogPosts
      MongoDb__ActivityLogCollectionName: ActivityLogs
      BasicAuth__AdminUsername: ${BASIC_AUTH_ADMIN_USERNAME}
      BasicAuth__AdminPassword: ${BASIC_AUTH_ADMIN_PASSWORD}
      BasicAuth__EditorUsername: ${BASIC_AUTH_EDITOR_USERNAME}
      BasicAuth__EditorPassword: ${BASIC_AUTH_EDITOR_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  blog-mongo-data:
  mongo-keyfile:
